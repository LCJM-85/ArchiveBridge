spring:
  application:
    name: scau-archive-insight

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:scau_archive}
    username: ${DB_USER:postgres}
    password: ${DB_PASS}
    type: com.alibaba.druid.pool.DruidDataSource

    druid:
      # 初始连接数
      initial-size: 5
      # 最小连接池数量
      min-idle: 10
      # 最大连接池数量
      max-active: 20
      # 获取连接等待超时的时间(毫秒)
      max-wait: 60000
      # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
      time-between-eviction-runs-millis: 60000
      # 配置一个连接在池中最小生存的时间，单位是毫秒
      min-evictable-idle-time-millis: 300000
      # 配置一个连接在池中最大生存的时间，单位是毫秒
      max-evictable-idle-time-millis: 900000
      # 用来检测连接是否有效的sql，要求是一个查询语句
      validation-query: SELECT 1
      # 建议配置为true，不影响性能，并且保证安全性
      test-while-idle: true
      # 申请连接时执行validationQuery检测连接是否有效
      test-on-borrow: false
      # 归还连接时执行validationQuery检测连接是否有效
      test-on-return: false
      # 是否缓存preparedStatement，也就是PSCache
      pool-prepared-statements: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 0
          max-wait: 2s

  servlet:
    multipart:
      enabled: true
      max-file-size: 200MB
      max-request-size: 500MB

# 服务器配置（默认8080，和前端请求匹配）
server:
  port: 8080
  servlet:
    context-path: / # 上下文路径，默认/即可
  tomcat:
    max-http-form-post-size: 500MB

# LLM 配置（用于 LLM 智能提取 + AI 助手，必须使用支持图片的多模态模型）
# 默认使用智谱 GLM-4V-Plus，需设置 GLM_API_KEY 环境变量
# 可更换为其他兼容 OpenAI API 的模型
llm:
   api-key: ${GLM_API_KEY:}
   base-url: ${LLM_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
   model: ${LLM_MODEL:glm-4v-plus-0111}

# 未登录被拦截时返回给前端的登录页地址（可与前端路由一致）
app:
  security:
    unauthorized-login-url: http://localhost/login

# SpringDoc Swagger 配置
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    try-it-out-enabled: true
    operations-sorter: method
    tags-sorter: alpha
  packages-to-scan: edu.scau.scauarchiveinsight.controller

# JWT 核心配置（和之前的 JwtUtils 工具类对应）
jwt:
  # 密钥：必须32位以上（生产环境建议用环境变量注入，不要硬编码）
  secret: ${JWT_SECRET}
  # Token 过期时间：单位秒（默认7天=604800秒）
  expiration: 86400
  # Token 前缀（前端请求头携带时用，如 Bearer xxxxx）
  token-prefix: Bearer
  # 存放 Token 的请求头名称
  header: Authorization
  # 可选：刷新 Token 过期时间（7天），用于 Token 续期
  refresh-expiration: 604800
