<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bridgeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#6366F1;#A78BFA;#38BDF8" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#6366F1">
        <animate attributeName="stop-color" values="#6366F1;#A78BFA;#22D3EE;#6366F1" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#22D3EE;#38BDF8;#A78BFA" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#94A3B8"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-0.3 0" to="0.3 0" dur="3s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#6366F1" stop-opacity="1"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="2.5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="docClip">
      <path d="M52 58 Q52 44 66 44 H148 L168 64 V148 Q168 162 154 162 H66 Q52 162 52 148 Z"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="42" fill="#05116d"/>
  <rect width="512" height="512" rx="42" fill="url(#bridgeGradient)" opacity="0.04"/>

  <g opacity="0.15" fill="#64748B">
    <circle cx="46" cy="58" r="1"/>
    <circle cx="105" cy="32" r="1"/>
    <circle cx="426" cy="67" r="1"/>
    <circle cx="470" cy="144" r="1"/>
    <circle cx="55" cy="445" r="1"/>
    <circle cx="452" cy="458" r="1"/>
  </g>

  <!-- Logo mark, enlarged and centered for the square layout. -->
  <g transform="translate(24, 28) scale(0.9)">
    <path d="M52 58 Q52 44 66 44 H148 L168 64 V148 Q168 162 154 162 H66 Q52 162 52 148 Z" fill="#F8FAFC"/>
    <path d="M148 44 V84 H188" fill="#CBD5E1"/>
    <line x1="72" y1="98" x2="142" y2="98" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="72" y1="122" x2="128" y2="122" stroke="#94A3B8" stroke-width="6" stroke-linecap="round"/>
    <line x1="72" y1="146" x2="118" y2="146" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <g clip-path="url(#docClip)">
      <rect x="52" y="44" width="116" height="8" fill="#38BDF8" opacity="0.25">
        <animate attributeName="y" from="44" to="162" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.35;0.35;0" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <path d="M148 130 C210 30, 290 30, 352 130" fill="none" stroke="url(#bridgeGradient)" stroke-width="14" stroke-linecap="round" filter="url(#softGlow)"/>
    <path d="M148 130 H352" stroke="#6366F1" stroke-width="12" stroke-linecap="round"/>

    <g filter="url(#nodeGlow)">
      <circle cx="250" cy="52" r="10" fill="#22D3EE">
        <animate attributeName="r" values="10;12;10" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.75;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="352" cy="130" r="12" fill="#A78BFA">
        <animate attributeName="r" values="12;14;12" dur="2.4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="98" r="9" fill="#38BDF8">
        <animate attributeName="r" values="9;11;9" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <line x1="250" y1="52" x2="352" y2="130" stroke="#22D3EE" stroke-width="3" stroke-dasharray="8 8" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1.2s" repeatCount="indefinite"/>
    </line>
    <line x1="352" y1="130" x2="420" y2="98" stroke="#38BDF8" stroke-width="3" stroke-dasharray="8 8" opacity="0.85">
      <animate attributeName="stroke-dashoffset" from="0" to="-32" dur="1s" repeatCount="indefinite"/>
    </line>

    <rect x="395" y="68" width="68" height="68" rx="12" fill="#1E293B" stroke="#38BDF8" stroke-width="3">
      <animate attributeName="stroke-opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="420" cy="98" r="5" fill="white"/>
    <circle cx="442" cy="84" r="5" fill="white" opacity="0.9"/>
    <circle cx="442" cy="112" r="5" fill="white" opacity="0.9"/>
  </g>

  <rect x="72" y="223" width="368" height="2" rx="1" fill="url(#accentGradient)" opacity="0.75"/>

  <!-- The product name is intentionally split across two lines. -->
  <g text-anchor="middle">
    <text x="256" y="309" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="62" font-weight="700" letter-spacing="-1" fill="url(#titleGradient)">Archive</text>
    <text x="256" y="373" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="62" font-weight="700" letter-spacing="-1" fill="url(#titleGradient)">Bridge</text>
    <text x="256" y="420" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="500" fill="#94A3B8" letter-spacing="7">
      数智档桥
      <animate attributeName="opacity" values="0.65;1;0.65" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="256" y="458" font-family="Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748B" letter-spacing="1.6">AI-POWERED ARCHIVE DIGITIZATION</text>
  </g>

  <g>
    <circle cx="240" cy="480" r="3" fill="#38BDF8" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="256" cy="480" r="3" fill="#6366F1" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="272" cy="480" r="3" fill="#A78BFA" opacity="0.5">
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="1" y="1" width="510" height="510" rx="41" fill="none" stroke="url(#bridgeGradient)" stroke-width="2" opacity="0.4"/>
</svg>
